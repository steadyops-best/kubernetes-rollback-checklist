name: Test and Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile tools/k8s_rollback_snapshot.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/k8s_rollback_snapshot.py --help >/dev/null
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tested kit
        run: |
          tar -czf kubernetes-rollback-kit.tar.gz README.md checklist.md rollback-evidence-template.md tools LICENSE CITATION.cff
          sha256sum kubernetes-rollback-kit.tar.gz > kubernetes-rollback-kit.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kubernetes-rollback-kit.tar.gz
            kubernetes-rollback-kit.tar.gz.sha256
